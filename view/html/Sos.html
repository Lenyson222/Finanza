<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanza - Data Intelligence</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/Dashboard.css">
    <link rel="stylesheet" href="../css/Sos.css">
</head>

<body>

    <div id="main-dashboard">
        <header class="glass-header">
            <div class="header-logo-wrapper">
                <img src="../../logopn.png" alt="Logo">
                <h1 class="glow-text-blue" style="font-size: 27px; margin: 0;">FINANZA</h1>
            </div>

            <nav class="nav-menu">
                <a href="Inicio.html">Início</a>
                <a href="Metas.html">Metas</a>
                <a href="Cotacoes.html">Cotações</a>
                <a href="Investimentos.html">Investimentos</a>
                <a class="ativo" href="Sos.html">Simulador de Juros</a>
                <a href="Perfil.html">Perfil</a>
            </nav>

            <div class="perfil-usuario">
                <span id="nome-usuario" class="user-name"></span>
                <img id="foto-usuario" class="foto-perfil" src="" alt="Foto de Perfil" style="display: none;">
            </div>
        </header>

        <main class="main-content">
            <section id="tela-operacional" class="section-grid fade-in-up">

                <div class="inputs-column">

                    <!-- INÍCIO SOS FINANCEIRO -->
                    <article id="aba-sos" class="sub-aba ativa">
                        <div class="card glass-card sos-main-card">
                            <div class="card-header-flex" style="margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-light);">
                                <h2 class="card-title text-blue" style="margin: 0; font-size: 22px;">Simulador de Juros</h2>
                            </div>
                            <div class="sos-grid-colunas" style="display: grid; grid-template-columns: 1fr; gap: 30px;">
                                <div class="glass-card inner-calc" style="background: rgba(10, 10, 15, 0.6); border: 1px solid var(--border-light); padding: 25px;">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                                        <h4 class="card-title text-main" style="font-size: 16px; margin: 0;">Calculadora de Juros</h4>
                                        <select id="calc-tipo-juros" class="custom-select" style="width: auto; padding: 6px 12px; font-size: 13px;" onchange="window.calcularJurosUnificado()">
                                            <option value="simples">Juros Simples</option>
                                            <option value="composto">Juros Compostos</option>
                                        </select>
                                    </div>
                                    
                                    <div class="input-group">
                                        <label class="uppercase-label">Capital Inicial (R$)</label>
                                        <input type="number" id="calc-capital" placeholder="Ex: 1000" oninput="window.calcularJurosUnificado()">
                                    </div>
                                    <div class="input-group">
                                        <label class="uppercase-label">Taxa de Juros ao Mês (%)</label>
                                        <input type="number" id="calc-taxa" placeholder="Ex: 1.5" step="0.1" oninput="window.calcularJurosUnificado()">
                                    </div>
                                    <div class="input-group">
                                        <label class="uppercase-label">Tempo (Meses)</label>
                                        <input type="number" id="calc-tempo" placeholder="Ex: 12" oninput="window.calcularJurosUnificado()">
                                    </div>

                                    <div class="divider" style="margin: 20px 0;"></div>
                                    
                                    <div class="sos-stats-grid" style="grid-template-columns: 1fr;">
                                        <div class="sos-stat-item" style="border-left: 4px solid var(--accent-blue); padding-left: 15px; background: transparent; border-radius: 0;">
                                            <p style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px;">Juros Gerados</p>
                                            <h5 id="calc-resultado-juros" class="text-blue" style="font-size: 20px; font-weight: 800; font-family: monospace;">R$ 0,00</h5>
                                            <div style="margin-top: 15px;"></div>
                                            <p style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px;">Montante Total</p>
                                            <h4 id="calc-resultado-montante" style="font-size: 28px; font-weight: 900; color: #fff; letter-spacing: -1px;">R$ 0,00</h4>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- FIM CALCULADORAS DE JUROS -->

                        </div>
                    </article>
                    <!-- FIM SOS FINANCEIRO -->
                </div>

                <aside id="sidebar-principal" class="sidebar-sticky">
                    <div id="status-card" class="card glass-card card-destaque">
                        <label id="label-sobra" class="text-green uppercase-label">Sobra Mensal Estimada</label>
                        <div id="resultado-sobra" class="valor-gigante">R$ 0,00</div>
                    </div>

                    <div id="card-grafico-distribuicao" class="card glass-card" style="padding: 20px;">
                        <h2 class="card-title text-blue" style="font-size: 16px; margin-bottom: 15px;">Distribuição de Despesas</h2>
                        <div class="chart-container" style="width: 100%;">
                            <canvas id="meuGrafico"></canvas>
                        </div>
                        <div id="distribuicao-legenda"></div>
                    </div>
                </aside>
            </section>
        </main>
    </div>

    <datalist id="opcoes-categorias-saida">
        <option value="Alimentação">
        <option value="Supermercado">
        <option value="Transporte">
        <option value="Saúde">
        <option value="Lazer">
        <option value="Contas Residenciais">
        <option value="Cartão de Crédito / Serviços">
        <option value="Educação">
        <option value="Vestuário">
        <option value="Pix / Transferências">
        <option value="Outros">
    </datalist>

    <datalist id="opcoes-categorias-entrada">
        <option value="Salário">
        <option value="Pró-labore">
        <option value="Rendimentos">
        <option value="Venda">
        <option value="Reembolso">
        <option value="TED Recebida">
        <option value="PIX Recebido">
        <option value="Presente">
    </datalist>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-init.js"></script>
    <script src="../js/db.js"></script>
    <script type="module" src="../js/Sos.js"></script>

</body>

</html>
